; ============================================================================
; AHBU Akilli Ev Kontrol - ESP32-S3 (Waveshare ESP32-S3-POE-ETH-8DI-8RO)
;
;   Derleme   : pio run                         (varsayilan ortam: esp32-s3-waveshare)
;   PC testi  : pio test -e native              (Unity; saf mantik: ShutterFsm, ModbusRtu, RelayRules, SystemConfig, DiGate,
;                                                guvenlik, NetLinkCore, sablon ayristirici/kurallari/TPL cercevesi)
;
; Makineye ozel ayarlar (ornegin PlatformIO cekirdek dizini `core_dir`) BU DOSYAYA YAZILMAZ; depoya girmeyen
; `platformio_local.ini` dosyasina konur (.gitignore'da). Dosya yoksa sessizce yok sayilir ve PlatformIO
; varsayilan cekirdek dizinini (~/.platformio) kullanir. Ornek icerik:
;     [platformio]
;     core_dir = D:\.platformio
; ============================================================================
[platformio]
default_envs = esp32-s3-waveshare
src_dir = src
lib_dir = lib
extra_configs = platformio_local.ini

[env:esp32-s3-waveshare]
; Kurulu surum SABITLENDI: ayni kaynak her makinede/CI'da ayni platform+Arduino cekirdegiyle derlenir.
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.arduino.memory_type = dio_opi
board_build.partitions = app3M_fat9M_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Isrc

; Waveshare DEMO dosyalari derlemeden CIKARILDI (hicbir canli kod cagirmiyor; kullanim haritasi: main.cpp,
; SmartAutomation*.cpp, MqttManager/WiFiManager/WebPortal yalnizca GPIO_Init, Buzzer_Open_Time, RGB_Open_Time,
; I2C_Init, PCF85063_Init, Relay_Init/Relay_CHx ve DIN_PIN_CHx tanimlarini kullanir):
;   WS_WIFI / WS_MQTT / WS_Bluetooth / WS_CAN / WS_SD / WS_Serial / WS_RS485 : demo ag/seri yollari
;                      (sabit SSID/parola/bulut kimligi iceriyorlardi, interlock'u atlayarak role suruyorlardi)
;   WS_ETH           : v1.3.0'da SILINDI; yerine EthLink.cpp (W5500, IDF 4.4 esp_eth; demo NTP/RTC kodu geri gelmedi)
;   WS_DIN           : demo DI gorevi (DINTask rolelere dogrudan yaziyordu)
;   WS_RTC           : demo zamanli olay gorevi (rolelere dogrudan yaziyordu); RTC OKUMASI icin
;                      WS_PCF85063.cpp (PCF85063_Init) derlemede KALIR.
; Kalanlar: WS_GPIO (RGB/buzzer), WS_Relay, WS_TCA9554PWR, WS_PCF85063, I2C_Driver ve uygulama kaynaklari.
build_src_filter =
    +<*>
    -<WS_WIFI.cpp>
    -<WS_MQTT.cpp>
    -<WS_Bluetooth.cpp>
    -<WS_CAN.cpp>
    -<WS_SD.cpp>
    -<WS_Serial.cpp>
    -<WS_RS485.cpp>
    -<WS_DIN.cpp>
    -<WS_RTC.cpp>

; PC (native) testleri cihaz ortaminda derlenmesin
test_ignore = test_*

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.4
    knolleary/PubSubClient @ ^2.8
    arduino-libraries/NTPClient @ ^3.2.1

; ----------------------------------------------------------------------------
; PC birim testleri (Unity). BU MAKINEDE C++ DERLEYICISI (gcc/clang) OLMADIGI icin
; `pio test -e native` burada CALISTIRILAMADI; testler ayni kodla NDK clang (wasm32) + Node'da
; Unity-alt-kumesi shim'i ile kosturuldu (bkz. proje raporu). Gelistirici makinesinde gcc/clang ile:
;     pio test -e native
; ESP32 kaynaklari bu ortamda derlenmez; testler saf basliklari (src/ShutterFsm.h, src/ModbusRtu.h,
; src/RelayRules.h, src/SystemConfig.h, src/DiGate.h) -Isrc ile dogrudan include eder.
; ----------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
test_build_src = no
; test_template_parse ArduinoJson ister (cihaz ortamiyla ayni surum); sablon ornekleri docs/contracts/template/fixtures (TPL_FIXTURES
; ortam degiskeniyle de verilebilir).
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.4
build_flags =
    -Isrc
    -Wall
    -Wextra
