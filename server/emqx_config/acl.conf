%% 1. Dashboard ve Sistem Konuları
{allow, {username, "dashboard"}, subscribe, ["$SYS/#"]}.

%% 2. Backend Servisi: Tüm dairelerin konularını yönetir
{allow, {username, "backend_service"}, all, ["ev/#"]}.

%% 3. Daire Kullanıcıları ve Donanımları: YALNIZCA kendi daire ID'lerine erişebilir
%% Örn: Kullanıcı adı 'home_101' ise yalnızca 'ev/home_101/#' konusuna pub/sub yapabilir
{allow, all, all, ["ev/${username}/#"]}.

%% 4. KESİN KURAL: Eşleşmeyen tüm istekleri engelle (Zero Trust)
{deny, all}.

