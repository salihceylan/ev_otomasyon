%% =========================================================================
%% GUDE TEKNOLOJI - AKILLI EV OTOMASYONU EMQX ACL (DOSYA YEDEGI)       [WP-C, plan C6]
%% =========================================================================
%% Bu dosya EMQX yetkilendirme zincirinde PostgreSQL kaynagindan (mqtt_acl tablosu) SONRA gelir
%% (bkz. emqx.conf). Yeni kimlikler (cihaz d_{t}, uygulama a_{t}_{rastgele}) ACL'lerini tabloda
%% tasir; burada YALNIZCA yedek kurallar vardir. Eslesmeyen her sey reddedilir (no_match = deny).
%%
%% Sozdizimi (EMQX 5): {izin, kim, eylem, [konular]}.  Her kural noktayla biter.
%% Backend ("backend_service") authn sorgusunda is_superuser=TRUE oldugundan zaten yetkilendirmeyi
%% atlar; asagidaki kural yalnizca yedektir.

%% 1. Backend servisi: tum evlerin konulari (superuser bayragi eksik kalirsa bile calissin).
{allow, {username, "backend_service"}, all, ["ev/#"]}.

%% 2. LEGACY (GECIS DONEMI) - eski paylasilan kimlikler (home_101 gibi):
%%    YALNIZCA kendi ev konularina erisir. Legacy yolu kapatirken BU BLOGU SIL
%%    (docs/DEPLOY_RUNBOOK.md: tum cihazlar yeni firmware ile yeniden flash edildikten sonra).
%%    Not: bu paylasilan kimlikler hala cmd'ye yayin yapabilir; guvenlik acigi gecis suresince
%%    bilerek acik tutulur ve sure sinirlidir.
{allow, {username, {re, "^home_[A-Za-z0-9]+$"}}, all, ["ev/${username}/#"]}.

%% 3. Hicbir kullanici sistem konularini veya joker abonelikleri okuyamaz.
{deny, all, subscribe, ["$SYS/#", {eq, "#"}, {eq, "ev/#"}, {eq, "ev/+/#"}]}.

%% 4. KESIN KURAL: eslesmeyen tum istekleri engelle (Zero Trust).
{deny, all}.
