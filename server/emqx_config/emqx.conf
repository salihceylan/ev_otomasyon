## AHBU Akilli Ev - EMQX 5.8 yapilandirmasi (WP-C, plan C6)         [CONTRACTS §2]
## =============================================================================
## docker-compose.yml bu dosyayi /opt/emqx/etc/emqx.conf olarak SALT-OKUNUR baglar (varsayilan
## emqx.conf'un yerini alir). Sir (parola) BU DOSYADA YOKTUR: ${EV_AUTHDB_*} degerleri
## docker-compose.yml'deki ortam degiskenlerinden gelir (HOCON ortam degiskeni yerine koyma).
##
## !! Bu dosya EMQX/Docker olmayan bir makinede yazildi; sozdizimi ve alan adlari elle denetlendi
## !! ama ACILISTA DOGRULANMADI. Hazirlik ortaminda `docker compose up emqx` ile acilisi ve
## !! scripts/ iceriginde belirtilen kontrol listesini (docs/DEPLOY_RUNBOOK.md) calistirin.
## !! HOCON ${...} ortam yerine koymasi calismazsa yedek: ayni degerleri EMQX_AUTHENTICATION__1__PASSWORD
## !! ve EMQX_AUTHORIZATION__SOURCES__1__PASSWORD ortam degiskenleriyle verin.
##
## KIMLIK (authentication)  --  tek PostgreSQL authenticator, bcrypt
##   EMQX 5'te bir kimlik zincirinde ayni (mechanism, backend) cifti YALNIZCA BIR KEZ bulunabilir ve
##   ozet algoritmasi authenticator basinadir; bu yuzden "bcrypt tablosu + SHA-256 legacy tablosu"
##   iki ayri PostgreSQL authenticator'i olarak KURULAMAZ. Tek sorgu iki kaynagi birlestirir ve
##   ikisi de BCRYPT olmak zorundadir:
##     1) mqtt_credentials (WP-B): cihaz d_{t}, uygulama a_{t}_{rastgele} (suresi `expires_at`),
##        backend_service (is_superuser).
##     2) mqtt_users (LEGACY, gecis donemi): yalnizca bcrypt'e YUKSELTILMIS ($2...) ve superuser
##        OLMAYAN satirlar. Eski SHA-256 satirlar ve legacy superuser KABUL EDILMEZ.
##        Yukseltme: scripts/upgrade_legacy_mqtt_user.js (parola operatorun ortamindan).
##   Bir kullanici adi birinci kaynakta varsa ONCE o kullanilir (ORDER BY prio).
## YETKI (authorization): 1) PostgreSQL mqtt_acl (kullanici basina satirlar), 2) dosya acl.conf
##   (backend + LEGACY blogu + deny all). no_match = deny.
## TLS: 8883 dinleyicisi yalnizca TLS 1.3 ve 1.2 (eski surumler kapali).
##
## Kapatma (legacy gecisi bitince): `ev/home_*` LEGACY blogunu acl.conf'tan sil, mqtt_users
## satirlarini sil (docs/DEPLOY_RUNBOOK.md).

node {
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

dashboard {
  listeners.http {
    bind = 18083
  }
}

## ---------------------------------------------------------------------------
## MQTT sinirlari (kotu niyetli/hatali istemciye karsi)
## ---------------------------------------------------------------------------
mqtt {
  ## state yukleri < 4 KB; 16 KB bol bol yeter
  max_packet_size = "16KB"
  max_clientid_len = 128
  max_topic_levels = 8
  retain_available = true
  wildcard_subscription = true
  shared_subscription = false
  ## Kalici oturumlu (clean=false) abonelerde (backend koprusu) cevrimdisiyken QoS0 durum
  ## mesajlari BIRIKTIRILMAZ: bayat kalp atislari yeniden baglaninca yigilmasin.
  mqueue_store_qos0 = false
  max_mqueue_len = 1000
  session_expiry_interval = "2h"
}

## Retained `state`/`status` mesajlari kucuk olmali
retainer {
  enable = true
  max_payload_size = "16KB"
}

## ---------------------------------------------------------------------------
## Dinleyiciler
## ---------------------------------------------------------------------------
listeners {
  ## Duz MQTT: docker-compose yalnizca 127.0.0.1:1884'e yayinlar (backend koprusu). Dis agdan ERISILEMEZ.
  tcp {
    default {
      bind = "0.0.0.0:1883"
      max_connections = 1024
    }
  }

  ## Genel MQTTS (cihazlar ve uygulamalar): docker-compose 8884 -> 8883. TLS 1.3 + 1.2.
  ssl {
    default {
      bind = "0.0.0.0:8883"
      max_connections = 20000
      ssl_options {
        certfile = "/opt/emqx/etc/certs/fullchain.pem"
        keyfile = "/opt/emqx/etc/certs/privkey.pem"
        versions = ["tlsv1.3", "tlsv1.2"]
        verify = verify_none
      }
    }
  }

  ## Kullanilmayan WebSocket dinleyicileri kapali
  ws {
    default {
      enable = false
    }
  }
  wss {
    default {
      enable = false
    }
  }
}

## ---------------------------------------------------------------------------
## Kimlik dogrulama (tek PostgreSQL authenticator; bcrypt)
## ---------------------------------------------------------------------------
authentication = [
  {
    mechanism = password_based
    backend = postgresql
    enable = true
    server = ${EV_AUTHDB_SERVER}
    database = ${EV_AUTHDB_NAME}
    username = ${EV_AUTHDB_USER}
    password = ${EV_AUTHDB_PASSWORD}
    password_hash_algorithm {
      name = bcrypt
    }
    query = "SELECT password_hash, is_superuser FROM (SELECT password_hash, is_superuser, 1 AS prio FROM mqtt_credentials WHERE username = ${username} AND (expires_at IS NULL OR expires_at > NOW()) AND (client_id IS NULL OR client_id = ${clientid}) UNION ALL SELECT password_hash, FALSE AS is_superuser, 2 AS prio FROM mqtt_users WHERE username = ${username} AND COALESCE(is_superuser, FALSE) = FALSE AND password_hash LIKE '$2%') AS creds ORDER BY prio LIMIT 1"
  }
]

## ---------------------------------------------------------------------------
## Yetkilendirme
## ---------------------------------------------------------------------------
authorization {
  no_match = deny
  deny_action = ignore
  cache {
    enable = true
    max_size = 256
    ttl = "1m"
  }
  sources = [
    {
      type = postgresql
      enable = true
      server = ${EV_AUTHDB_SERVER}
      database = ${EV_AUTHDB_NAME}
      username = ${EV_AUTHDB_USER}
      password = ${EV_AUTHDB_PASSWORD}
      query = "SELECT permission, action, topic FROM mqtt_acl WHERE username = ${username}"
    },
    {
      type = file
      enable = true
      path = "${EMQX_ETC_DIR}/acl.conf"
    }
  ]
}
