# ==============================================================================
# AHBU Akilli Ev - nginx sablonu: evotomasyon.gudeteknoloji.com.tr            [WP-C, plan C7]
# ==============================================================================
# SABLONDUR: sunucuya almadan once `nginx -t` ile sozdizimi/cakisma denetimi YAPILMALIDIR.
# Bu makinede nginx yoktur; dosya elle denetlendi, calistirilmadi.
#
# Ayni sunucuda uretimdeki kapi sistemi baska sanal sunucularla calisiyor. Bu dosya YALNIZCA
# `evotomasyon.gudeteknoloji.com.tr` icin server blogu tanimlar (default_server DEGIL). `http`
# baglaminda ortak olan adlar (map degiskeni, limit_req_zone, ssl_session_cache, upstream) baska
# sitelerinkiyle CAKISMASIN diye hepsi `ev_` / `evotomasyon_` oneklidir.
#
# Kurulum: /etc/nginx/sites-available/ altina kopyala, sites-enabled'a bagla, `nginx -t && systemctl reload nginx`.
# Sertifika: certbot ile alinmis olmali (yollar asagida). ACME dogrulamasi icin 80 numarali blokta
# /.well-known/acme-challenge/ yolu acik birakildi (webroot: /var/www/certbot; certbot --nginx kullaniliyorsa
# kendi eklemesini yapar, bu blok yine zararsizdir).
#
# Uygulama YALNIZCA 127.0.0.1:5000'de dinler (server.js BIND_HOST=127.0.0.1); disaridan dogrudan erisilemez.
# MQTTS (EMQX) nginx'ten gecmez: dogrudan 8884 (docker-compose.yml).

# --- http baglami: ortak, benzersiz adlar -----------------------------------
map $http_upgrade $ev_connection_upgrade {
    default upgrade;
    ''      close;
}

# Genel API: IP basina 10 istek/sn (burst 40); kimlik uclari: 5 istek/sn (burst 10)
# (limit_req_status asagida server blogunda: http duzeyinde olsaydi baska sitelerin davranisini degistirirdi)
limit_req_zone $binary_remote_addr zone=evotomasyon_api:10m  rate=10r/s;
limit_req_zone $binary_remote_addr zone=evotomasyon_auth:10m rate=5r/s;

# --- HTTP -> HTTPS yonlendirme -----------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name evotomasyon.gudeteknoloji.com.tr;

    # certbot webroot dogrulamasi
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS -----------------------------------------------------------------------
server {
    # `http2` bayragi tum nginx surumlerinde calisir (>= 1.25.1'de "deprecated" uyarisi verebilir; hata degil)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name evotomasyon.gudeteknoloji.com.tr;

    # Hiz siniri asildiginda 503 yerine 429 (yalnizca bu sanal sunucu)
    limit_req_status 429;

    ssl_certificate     /etc/letsencrypt/live/evotomasyon.gudeteknoloji.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evotomasyon.gudeteknoloji.com.tr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:EVSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    # HSTS (1 yil). Alt alanlari kapsamak icin includeSubDomains: yalnizca bu ana bilgisayarin altindakiler.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Istek sinirlari: JSON API; 256 KB govde yeter (server.js de ayni siniri uygular)
    client_max_body_size 256k;
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          30s;
    keepalive_timeout     30s;

    # Kimlik uclari (giris, sifre sifirlama, OTP, servis girisi): daha siki hiz siniri
    location ~ ^/api(/v1)?/auth/ {
        limit_req zone=evotomasyon_auth burst=10 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Istemcinin gonderdigi X-Forwarded-For'a GUVENILMEZ: tek deger, dogrudan baglanti adresi.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ev_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Uygulama baglantilari (bireysel-9): etiket karekodu /claim?uid=&pin= ve sifirlama / sihirli giris baglantilari
    # tarayicida acilinca uygulama statik yonlendirme sayfasi doner. Sorgu dizgesi PIN/belirtec tasiyabilir:
    # erisim gunlugune YAZILMAZ. Proxy ayarlari `location /` ile aynidir.
    location = /claim {
        access_log off;
        limit_req zone=evotomasyon_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ev_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    location = /reset-password {
        access_log off;
        limit_req zone=evotomasyon_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ev_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    location ^~ /magic-login {
        access_log off;
        limit_req zone=evotomasyon_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ev_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    location / {
        limit_req zone=evotomasyon_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ev_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
